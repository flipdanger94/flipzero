name: Preproduction Release CI

on:
  push:
    branches:
      - release/phase9-11-preprod
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: preprod-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Validate release smoke script
        run: node --check scripts/release-smoke.mjs

      - name: Build
        run: pnpm exec next build
