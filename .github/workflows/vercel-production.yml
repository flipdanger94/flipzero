name: Deploy Vercel Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'flipdanger94/flipzero'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"orgId":"team_AsHje38KtN3G35JN0zHFPSmH","projectId":"prj_a7vxV0ljAd6K0oj9yXmngYDyk4Oz","projectName":"flipzero.app"}
          JSON

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --scope=flip24 --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production
        run: vercel build --prod --scope=flip24 --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --scope=flip24 --token=${{ secrets.VERCEL_TOKEN }}
