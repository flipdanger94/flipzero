name: Responsive Accessibility Performance CI

on:
  push:
    branches:
      - feat/responsive-accessibility-performance-phase10
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      - name: Lint Phase 10
        run: >
          pnpm exec eslint
          hooks/use-modal-a11y.ts
          components/account-settings-dialog.tsx
          components/admin-dialog.tsx
          components/channel-permissions-dialog.tsx
          components/create-category-dialog.tsx
          components/create-channel-dialog.tsx
          components/create-space-dialog.tsx
          components/developer-dialog.tsx
          components/discovery-dialog.tsx
          components/events-dialog.tsx
          components/gamification-dialog.tsx
          components/invite-manager-dialog.tsx
          components/member-manager-dialog.tsx
          components/persistent-chat.tsx
          components/moderation-dialog.tsx
          components/role-manager-dialog.tsx
          components/social-hub-dialog.tsx
          components/space-settings-dialog.tsx
          components/system-status-dialog.tsx
          components/wiki-dialog.tsx
          app/api/messages/route.ts
          app/api/v1/spaces/[spaceId]/members/route.ts
          components/flipzero-app.tsx

      - name: Build
        run: pnpm build
