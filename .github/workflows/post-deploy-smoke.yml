name: Post-deploy Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment base URL, e.g. https://flipzeroapp.vercel.app"
        required: true
        default: "https://flipzeroapp.vercel.app"

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run release smoke checks
        env:
          FLIPZERO_BASE_URL: ${{ inputs.base_url }}
        run: node scripts/release-smoke.mjs
